<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="{{url_for('static', filename='css/bootstrap.min.css')}}" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row">
      <div class="col-12">
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
          <h2 class="mb-0 text-center">Welcome, {{session['username']}}</h2>
        </div>
      </div>
    </div>
    {% for category, message in get_flashed_messages(with_categories=True) %}
       <div class ='alert {%if category == "error"%} alert-danger{%else%}alert-success{%endif%}'>   
            {{message}}
        </div>
   {% endfor %}
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-between p-4">
            <div>
              <h4 class="card-title">Create Lecturer</h4>
              <p class="card-text text-muted">Add a new lecturer to the system.</p>
            </div>
            <a href="{{ url_for('admin.create_lecturer') }}" class="btn btn-primary mt-3">Create Lecturer</a>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-between p-4">
            <div>
              <h4 class="card-title">Create Student</h4>
              <p class="card-text text-muted">Register a new student in the system.</p>
            </div>
            <a href="{{ url_for('admin.create_student') }}" class="btn btn-outline-primary mt-3">Create Student</a>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-12 text-end">
        <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">Logout</a>
      </div>
    </div>
  </div>
  <script src = "{{url_for('static', filename='js/bootstrap.bundle.min.js')}}"></script>
</body>
</html>
