<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUAAMS — Sign In</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
</head>
<body>
    <div class="login-wrap">

        <div class="brand">
            <div class="brand-badge">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                        <path d="M14 14h.01M18 14h.01M14 18h.01M18 18h.01"/>
                    </svg>
                </div>
                <span class="brand-name">SUA<span>AMS</span></span>
            </div>
            <div class="brand-sub">Smart University Attendance &amp; Monitoring</div>
        </div>

        <div class="login-card">
            <div class="card-heading">Welcome back</div>
            <div class="card-sub">Sign in with your credentials to continue</div>

            {% for category, message in get_flashed_messages(with_categories=true) %}
                <div class="alert-custom {{ category }}">{{ message }}</div>
            {% endfor %}

            <form method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Staff ID or Matric Number" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-signin">Sign In</button>
            </form>
        </div>

        <div class="login-footer">
            SUAAMS &copy; {{ 2025 }} &nbsp;·&nbsp; Secured portal — authorised access only
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
