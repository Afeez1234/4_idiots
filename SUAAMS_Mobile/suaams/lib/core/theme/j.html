<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUAAMS Stealth Terminal Preview</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Rounded" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        terminal: {
                            base: '#000000',
                            surface: '#080808',
                            border: '#1A1A1A',
                            borderSubtle: '#111111',
                            textMuted: '#333333',
                            textSecondary: '#555555',
                            textPrimary: '#FFFFFF',
                            // Status Colors
                            successBg: '#0A1A0A',
                            successBorder: '#1A3A1A',
                            successText: '#2A6A2A',
                        }
                    },
                    letterSpacing: {
                        'widest-lg': '0.15em',
                        'widest-xl': '0.25em',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #050505; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .mobile-frame {
            width: 375px;
            height: 812px;
            background-color: #000000;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
            border: 8px solid #0A0A0A;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #0A0A0A;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="notch"></div>
        
        <!-- Ambient Glows -->
        <div class="absolute top-[-60px] right-[-50px] w-[200px] h-[200px] rounded-full bg-[radial-gradient(circle,#0A0A14_0%,transparent_70%)] opacity-80 pointer-events-none"></div>
        <div class="absolute bottom-[-40px] left-[-30px] w-[160px] h-[160px] rounded-full bg-[radial-gradient(circle,#080810_0%,transparent_70%)] opacity-70 pointer-events-none"></div>
        
        <!-- Tech Grid Overlay -->
        <svg class="absolute inset-0 w-full h-full opacity-[0.035] pointer-events-none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="g2" width="28" height="28" patternUnits="userSpaceOnUse">
                    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.4"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#g2)"/>
        </svg>

        <div class="h-12 w-full flex justify-between items-end px-7 pb-2 text-terminal-textPrimary text-xs font-semibold z-40 relative">
            <span class="font-mono text-[10px]">09:41</span>
            <div class="flex space-x-1.5 text-terminal-textPrimary">
                <span class="material-icons-rounded" style="font-size: 14px;">signal_cellular_4_bar</span>
                <span class="material-icons-rounded" style="font-size: 14px;">wifi</span>
                <span class="material-icons-rounded" style="font-size: 14px;">battery_full</span>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6 relative z-10 flex flex-col">
            
            <!-- Top bar -->
            <div class="flex justify-between items-center mb-8 mt-2">
                <div>
                    <div class="text-[9px] text-[#444444] tracking-widest-lg uppercase mb-1 font-bold">Welcome back</div>
                    <div class="text-[17px] font-semibold text-terminal-textPrimary tracking-wide">Jane Doe</div>
                </div>
                <div class="w-9 h-9 rounded-xl bg-[#0A0A0A] border border-[#222222] flex items-center justify-center">
                    <span class="text-[10px] font-bold text-terminal-textPrimary tracking-wider">JD</span>
                </div>
            </div>

            <!-- Next session / Active Scan -->
            <div class="bg-terminal-surface border border-[#1E1E1E] border-l-[3px] border-l-terminal-textPrimary rounded-xl p-4 mb-6 shadow-2xl">
                <div class="text-[9px] text-[#444444] tracking-widest-lg uppercase mb-2 font-bold">Next session in 15 min</div>
                <div class="text-[14px] font-semibold text-terminal-textPrimary mb-3 tracking-wide">CPE 401 — Microprocessors</div>
                <button class="w-full bg-terminal-textPrimary rounded-lg py-3 text-center transition-transform active:scale-[0.98]">
                    <span class="text-[10px] font-extrabold text-terminal-base tracking-widest-lg uppercase">INITIATE SCAN</span>
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-2.5 mb-8">
                <div class="bg-terminal-surface border border-terminal-border rounded-lg p-3 text-center flex flex-col items-center justify-center">
                    <div class="text-[18px] font-semibold text-terminal-textPrimary mb-1">85%</div>
                    <div class="text-[8px] text-[#444444] tracking-wider uppercase font-bold">Overall</div>
                </div>
                <div class="bg-terminal-surface border border-terminal-border rounded-lg p-3 text-center flex flex-col items-center justify-center">
                    <div class="text-[18px] font-semibold text-terminal-textPrimary mb-1">34</div>
                    <div class="text-[8px] text-[#444444] tracking-wider uppercase font-bold">Sessions</div>
                </div>
                <div class="bg-terminal-surface border border-terminal-border rounded-lg p-3 text-center flex flex-col items-center justify-center">
                    <div class="text-[18px] font-semibold text-[#555555] mb-1">1</div>
                    <div class="text-[8px] text-[#444444] tracking-wider uppercase font-bold">Missed</div>
                </div>
            </div>

            <!-- Schedule -->
            <div class="text-[9px] text-[#444444] tracking-widest-lg uppercase mb-3 font-bold">Today's Protocol</div>
            
            <div class="flex flex-col gap-2 mb-6">
                
                <!-- Upcoming -->
                <div class="bg-terminal-surface border border-terminal-border rounded-lg p-3.5 flex justify-between items-center">
                    <div>
                        <div class="text-[13px] font-medium text-terminal-textPrimary mb-1">CPE 401 Lab</div>
                        <div class="text-[10px] text-[#444444] font-mono">10:00 AM — 12:00 PM</div>
                    </div>
                    <div class="bg-[#111111] border border-[#2A2A2A] rounded-md px-2 py-1">
                        <span class="text-[8px] text-[#555555] uppercase tracking-wider font-bold">Pending</span>
                    </div>
                </div>

                <!-- Present (Success) -->
                <div class="bg-terminal-surface border border-terminal-successBorder rounded-lg p-3.5 flex justify-between items-center">
                    <div>
                        <div class="text-[13px] font-medium text-terminal-textPrimary mb-1">MTH 402 Lecture</div>
                        <div class="text-[10px] text-[#444444] font-mono">08:00 AM — 09:30 AM</div>
                    </div>
                    <div class="bg-terminal-successBg border border-terminal-successBorder rounded-md px-2 py-1 flex items-center gap-1.5">
                        <div class="w-1.5 h-1.5 rounded-full bg-terminal-successText"></div>
                        <span class="text-[8px] text-terminal-successText uppercase tracking-wider font-bold">Present</span>
                    </div>
                </div>
                
            </div>
            
            <div class="mt-auto"></div>
        </div>

        <!-- Bottom nav -->
        <div class="flex justify-around items-center pt-4 pb-8 border-t border-terminal-borderSubtle bg-terminal-base relative z-20">
            <button class="flex flex-col items-center gap-1.5 opacity-100 transition-opacity">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span class="text-[8px] text-terminal-textPrimary font-semibold tracking-wider">HOME</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 opacity-40 hover:opacity-80 transition-opacity">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="text-[8px] text-terminal-textPrimary font-semibold tracking-wider">COURSES</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 opacity-40 hover:opacity-80 transition-opacity">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span class="text-[8px] text-terminal-textPrimary font-semibold tracking-wider">RECORDS</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 opacity-40 hover:opacity-80 transition-opacity">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text-[8px] text-terminal-textPrimary font-semibold tracking-wider">PROFILE</span>
            </button>
        </div>

    </div>

</body>
</html>
