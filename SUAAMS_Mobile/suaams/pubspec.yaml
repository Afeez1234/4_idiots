name: suaams
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  http: ^1.2.0 # or dio for advanced interceptors
  jwt_decoder: ^2.0.1
  device_info_plus: ^13.2.0
  android_id: ^0.4.0
  local_auth: ^3.0.2
  local_auth_ios: ^1.1.7
  local_auth_android: ^2.0.9
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  freerasp: ^8.2.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/suaams_icon.png"

flutter:
  uses-material-design: true

  # Fonts are BUNDLED, not fetched at runtime. `google_fonts` downloads
  # families over the network on first use and caches them; in a lecture
  # hall with unreliable wifi a failed first-run fetch silently drops the
  # whole app back to the platform typeface, and it reproduces fine on a
  # dev machine with good signal. Declaring the families here means
  # ThemeData(fontFamily: ...) and raw TextStyle(fontFamily: ...) both
  # resolve against the asset, with no network path at all.
  #
  # Plex Sans is the UI face. Plex Mono is the ACCENT face -- reserved for
  # data that has the shape of machine output (time ranges, session/course
  # codes, terminal status strings), not for labels or controls.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
