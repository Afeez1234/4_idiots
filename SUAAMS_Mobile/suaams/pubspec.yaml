name: suaams
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  http: ^1.2.0 # or dio for advanced interceptors
  jwt_decoder: ^2.0.1
  device_info_plus: ^13.2.0
  android_id: ^0.4.0
  local_auth: ^3.0.2
  local_auth_ios: ^1.1.7
  local_auth_android: ^2.0.9
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  freerasp: ^8.2.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons: mark C (figure + NFC signal), adopted 2026-10-08. Both
# PNGs are rendered from the same 48-unit geometry as SuaamsLogo
# (lib/shared/widgets/suaams_logo.dart). Regenerate the platform files with
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # Opaque square on deep black: iOS and pre-Android-8 launchers.
  image_path: "assets/icon/suaams_icon.png"
  # iOS rejects icons with an alpha channel.
  remove_alpha_ios: true
  # Android 8+: the launcher crops these to its own shape (circle, squircle).
  # The foreground keeps the mark inside the 66dp safe zone so no shape
  # clips the signal arcs.
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icon/suaams_icon_foreground.png"
  # The foreground PNG is already sized to the safe zone; the generator's
  # default 16% inset would shrink the mark a second time.
  adaptive_icon_foreground_inset: 0
  # NOTE: 0.14.4 also rewrites ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
  # in ios/Runner.xcodeproj/project.pbxproj from YES to "AppIcon" (a bug).
  # After regenerating, revert that file: git checkout -- ios/Runner.xcodeproj

flutter:
  uses-material-design: true

  # Fonts are BUNDLED, not fetched at runtime. `google_fonts` downloads
  # families over the network on first use and caches them; in a lecture
  # hall with unreliable wifi a failed first-run fetch silently drops the
  # whole app back to the platform typeface, and it reproduces fine on a
  # dev machine with good signal. Declaring the families here means
  # ThemeData(fontFamily: ...) and raw TextStyle(fontFamily: ...) both
  # resolve against the asset, with no network path at all.
  #
  # Plex Sans is the UI face. Plex Mono is the ACCENT face -- reserved for
  # data that has the shape of machine output (time ranges, session/course
  # codes, terminal status strings), not for labels or controls.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
